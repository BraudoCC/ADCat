<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADCat-注册</title>

    <link rel="stylesheet" href="/static/css/tailwind.min.css" />
    <link rel="stylesheet" href="/static/css/style_login.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/images/favicon/180.png">
    <link rel="icon" type="image/png" href="/static/images/favicon/32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="/static/images/favicon/16.png" sizes="16x16">

</head>
<body>
        <div class="relative min-h-screen flex">
            <div
                class="
                    flex flex-col
                    sm:flex-row
                    items-center
                    md:items-start
                    sm:justify-center
                    md:justify-start
                    flex-auto
                    min-w-0
                    bg-white
                "
            >
                <div
                    class="
                        sm:w-1/2
                        xl:w-3/5
                        h-full
                        hidden
                        md:flex
                        flex-auto
                        items-center
                        justify-center
                        p-10
                        overflow-hidden
                        bg-purple-900
                        text-white
                        bg-no-repeat bg-cover
                        relative
                    "
                    style="background-image: url(/static/images/login/bg-1.jpg)"
                >
                    <div
                        class="
                            absolute
                            bg-gradient-to-b
                            from-indigo-600
                            to-blue-500
                            opacity-75
                            inset-0
                            z-0
                        "
                    ></div>
                    <div class="w-full max-w-md z-10">
                        <div class="sm:text-4xl xl:text-5xl font-bold leading-tight mb-6">
                            ADCat
                        </div>
                        <div class="sm:text-sm xl:text-md text-gray-200 font-normal">
                            欢迎来到ADCat,开始为你的数据开始异常检测吧
                        </div>
                    </div>
                    <ul class="circles">
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                    </ul>
                </div>
                <div
                    class="
                        md:flex md:items-center md:justify-center
                        w-full
                        sm:w-auto
                        md:h-full
                        w-2/5
                        xl:w-2/5
                        p-8
                        md:p-10
                        lg:p-14
                        sm:rounded-lg
                        md:rounded-none
                        bg-white
                    "
                >
                    <div class="max-w-md w-full mx-auto space-y-8">
                        <div class="text-center">
                            <h2 class="mt-6 text-3xl font-bold text-gray-900">欢迎注册</h2>


                        <div class="flex items-center justify-center space-x-2">
                            <span class="h-px w-16 bg-gray-200"></span>
                            <span class="text-gray-300 font-normal">使用电子邮箱注册</span>
                            <span class="h-px w-16 bg-gray-200"></span>
                        </div>

                        <form class="mt-8 space-y-6 form-signin" action="{% url 'register' %}" method="POST">
                            {% csrf_token %}
                            <input type="hidden" name="remember" value="true" />
                            <div class="relative">
                                <label class="ml-3 text-sm font-bold text-gray-700 tracking-wide">
                                    电子邮箱
                                </label>
                                <input
                                    class="
                                        w-full
                                        text-base
                                        px-4
                                        py-2
                                        border-b border-gray-300
                                        focus:outline-none
                                        rounded-2xl
                                        focus:border-indigo-500
                                        form-control
                                    "
                                    type="email"
                                    placeholder="邮箱地址"
                                    name="email"

                                />
                            </div>

                            <div class="mt-8 content-center">
                                <label class="ml-3 text-sm font-bold text-gray-700 tracking-wide">
                                    密码
                                </label>
                                <input
                                    class="
                                        w-full
                                        content-center
                                        text-base
                                        px-4
                                        py-2
                                        border-b
                                        rounded-2xl
                                        border-gray-300
                                        focus:outline-none focus:border-indigo-500
                                        form-control
                                    "
                                    type="password"
                                    placeholder="请输入密码"
                                    name="password"
                                    required="required"
                                    minlength="6"
                                />
                            </div>

                            <div class="mt-8 content-center">
                                <label class="ml-3 text-sm font-bold text-gray-700 tracking-wide">
                                    确认密码
                                </label>
                                <input
                                    class="
                                        w-full
                                        content-center
                                        text-base
                                        px-4
                                        py-2
                                        border-b
                                        rounded-2xl
                                        border-gray-300
                                        focus:outline-none focus:border-indigo-500
                                        form-control

                                    "
                                    type="password"
                                    placeholder="请再次输入密码"
                                    name="rePassword"
                                    required="required"
                                    minlength="6"
                                />
                            </div>

{#                                {{ form.captcha }}#}
{#                                {{ form.captcha.errors }}#}
                            <div class="spacer-50"></div>
                            <div>
                                <button
                                    type="submit"
                                    class="
                                        w-full
                                        flex
                                        justify-center
                                        bg-gradient-to-r
                                        from-indigo-500
                                        to-blue-600
                                        hover:bg-gradient-to-l
                                        hover:from-blue-500
                                        hover:to-indigo-600
                                        text-gray-100
                                        p-4
                                        rounded-full
                                        tracking-wide
                                        font-semibold
                                        shadow-lg
                                        cursor-pointer
                                        transition
                                        ease-in
                                        duration-500
                                    "
                                    >注 册
                                </button>
                            </div>
                            <p
                                class="
                                    items-center
                                    justify-center
                                    mt-10
                                    text-center text-md text-gray-500
                                "
                            >
                                <div class="spacer-30"></div>
                                <span>已经有账号？</span>
                                <a
                                    href="{% url 'login' %}"
                                    target="_blank"
                                    class="
                                        text-indigo-400
                                        hover:text-blue-500
                                        no-underline
                                        hover:underline
                                        cursor-pointer
                                        transition
                                        ease-in
                                        duration-300
                                    "
                                    >立即登录
                                </a>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
